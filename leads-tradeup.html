<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KMP Consulting Case Tracker</title>
<style>
  :root {
    --ink: #2C2C2C;
    --muted: #6b6b6b;
    --line: #e6e4e0;
    --bg: #F8F7F5;
    --card: #ffffff;
    --accent: #F27B20;
    --navy: #001F4D;
    --accent-soft: #FFF6EE;
    --done: #2f7d5b;
    --warn: #b7791f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 14px;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 20px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brands { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brands .kmp { height: 46px; display: block; }
  .brands .tu { height: 46px; display: block; background: #fff; border-radius: 8px; padding: 6px 10px; }
  .brands .sep { width: 1px; height: 40px; background: rgba(255,255,255,.55); }
  .brands .label { font-size: 13px; opacity: .9; }
  th { color: var(--navy); }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 2px 0 0; opacity: .8; font-size: 13px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  button.primary { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
  button.danger { color: #9b2c2c; }
  main { padding: 22px 28px 60px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi span { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi strong { font-size: 22px; font-weight: 600; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input, .toolbar select {
    font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; min-width: 180px;
  }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { background: #fafafa; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: #fbfcfd; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--accent-soft); color: var(--accent); }
  .tag.ok { background: #e3f1ea; color: var(--done); }
  .tag.wait { background: #fdf3e1; color: var(--warn); }
  .steps { display: flex; gap: 4px; flex-wrap: wrap; }
  .step { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #cbd5e1; display: inline-block; }
  .step.on { background: var(--done); border-color: var(--done); }
  .muted { color: var(--muted); }
  .num { text-align: right; white-space: nowrap; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(20,25,35,.35); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; }
  .overlay.open { display: flex; }
  .panel { background: #fff; border-radius: 12px; width: min(760px, 100%); padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
  .panel h2 { margin: 0 0 4px; font-size: 18px; }
  .panel > p.muted { margin: 0 0 18px; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0 0 14px; }
  legend { padding: 0 6px; font-weight: 600; color: var(--accent); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select, textarea {
    font: inherit; font-size: 14px; color: var(--ink);
    padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
  }
  textarea { min-height: 70px; resize: vertical; }
  .check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; }
  .check input { width: 16px; height: 16px; }
  .split-result { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.6; }
  .panel footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 40px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 10px; }
  .tablewrap { overflow-x: auto; }
  .stage-quick { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; min-width: 150px; }
  .comment-preview { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px; }
  .comment { border-top: 1px solid var(--line); padding: 8px 0; }
  .comment .stamp { font-size: 12px; color: var(--muted); }
  .comment button.link { background: none; border: none; color: #9b2c2c; padding: 0; font-size: 12px; cursor: pointer; margin-top: 4px; }
  .comment-add { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }
  .comment-add textarea { flex: 1; }
  @media (max-width: 760px) {
    main, header { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>

    <h1 style="margin-top:12px">Case Tracker</h1>
    <p>Partner view for KMP Consulting and TradeUp Global: cases, stages, dates and financial split</p>
  </div>
  <div class="actions">
    <button class="ghost" id="btnExport">Export backup</button>
    <button class="ghost" id="btnImport">Import backup</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
    <button class="primary" id="btnNew">+ New case</button>
  </div>
</header>

<main>
  <section class="kpis" id="kpis"></section>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search client or visa">
    <select id="filterVisa"><option value="">All visas</option></select>
    <select id="filterStatus">
      <option value="">All statuses</option>
      <option value="Active">Active</option>
      <option value="Waiting client">Waiting client</option>
      <option value="Lodged">Lodged</option>
      <option value="Closed">Closed</option>
    </select>
  </div>

  <div id="tableWrap"></div>
</main>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="formTitle">New case</h2>
    <p class="muted">Dates use day, month and year. Amounts are in AUD.</p>
    <form id="caseForm">
      <fieldset>
        <legend>Client and case</legend>
        <div class="grid">
          <label>Client name<input name="client" required></label>
          <label>Visa stream<input name="visa" placeholder="e.g. 482, 820, 500" required></label>
          <label>Visa date (lodged or granted)<input type="date" name="visa_date"></label>
          <label>Current stage<select name="stage" id="stageSelect"></select></label>
          <label>Lead partner
            <select name="lead">
              <option>Keila</option>
              <option>Phill</option>
              <option>Shared</option>
            </select>
          </label>
          <label>Case status
            <select name="status">
              <option>Active</option>
              <option>Waiting client</option>
              <option>Lodged</option>
              <option>Closed</option>
            </select>
          </label>
          <label>Case opened<input type="date" name="opened"></label>
          <label>Next action<input name="next" placeholder="What is pending"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Stage dates (fill in when each step is done)</legend>
        <div class="grid">
          <label>Consultation held<input type="date" name="s_consult"></label>
          <label>Agreement sent<input type="date" name="s_agreement"></label>
          <label>Payment collected<input type="date" name="s_payment"></label>
          <label>Documents requested<input type="date" name="s_docs_req"></label>
          <label>Documents received<input type="date" name="s_docs_rec"></label>
          <label>Lodged with DHA<input type="date" name="s_lodged"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Fees and split</legend>
        <div class="grid">
          <label>Amount charged to client (total)<input type="number" step="0.01" min="0" name="amount_charged"></label>
          <label>Government fee (paid in full)<input type="number" step="0.01" min="0" name="gov_fee"></label>
          <label>Agency fee (paid in full)<input type="number" step="0.01" min="0" name="agency_fee"></label>
          <label>Professional fee (can be instalments)<input type="number" step="0.01" min="0" name="prof_fee"></label>
          <label>Professional fee received so far<input type="number" step="0.01" min="0" name="prof_paid"></label>
          <label>Keila share (%)<input type="number" step="1" min="0" max="100" name="share_keila"></label>
          <label>Phill share (%)<input type="number" step="1" min="0" max="100" name="share_phill"></label>
        </div>
        <p class="split-result" id="splitPreview" style="margin-top:12px"></p>
      </fieldset>

      <fieldset>
        <legend>Comments</legend>
        <div id="commentList"></div>
        <div class="comment-add">
          <textarea id="newComment" placeholder="Write a comment about this client"></textarea>
          <button type="button" id="btnAddComment">Add comment</button>
        </div>
      </fieldset>

      <footer>
        <button type="button" class="danger" id="btnDelete" hidden>Delete case</button>
        <div class="actions">
          <button type="button" id="btnCancel">Cancel</button>
          <button type="submit" class="primary">Save case</button>
        </div>
      </footer>
    </form>
  </div>
</div>

  const KEY = "kmp-case-tracker-v1";
  const STAGES = [
    ["s_consult", "Consultation"],
    ["s_agreement", "Agreement sent"],
    ["s_payment", "Payment collected"],
    ["s_docs_req", "Docs requested"],
    ["s_docs_rec", "Docs received"],
    ["s_lodged", "Lodged"]
  ];
  const STAGE_OPTIONS = ["Not started", "Consultation", "Agreement sent", "Payment collected", "Documents requested", "Documents received", "Lodged", "Visa decision"];
  const DEFAULTS = {
    id: "", client: "", visa: "", visa_date: "", lead: "Keila", status: "Active", stage: "Not started",
    opened: "", next: "", s_consult: "", s_agreement: "", s_payment: "", s_docs_req: "", s_docs_rec: "", s_lodged: "",
    amount_charged: 0, gov_fee: 0, agency_fee: 0, prof_fee: 0, prof_paid: 0, share_keila: 50, share_phill: 50
  };

  // No client data is stored in this file. Cases are added in the page and kept in the browser.
  const SEED = [];

  function uid() { return "c" + Math.random().toString(36).slice(2, 10); }

  function withDefaults(c) {
    const o = Object.assign({}, DEFAULTS, c);
    o.comments = Array.isArray(c.comments) ? c.comments.slice() : [];
    if (c.notes) { o.comments.unshift({ id: uid(), at: "", text: c.notes }); }
    o.comments.forEach(x => { if (!x.id) x.id = uid(); });
    delete o.notes;
    if (!o.id) o.id = uid();
    return o;
  }

  let cases = load();
  let editingId = null;
  let draftComments = [];

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw).map(withDefaults);
    } catch (e) {}
    return SEED.map(s => withDefaults(s));
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(cases)); } catch (e) {}
  }

  const money = n => "A$" + (Number(n) || 0).toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtDate = d => {
    if (!d) return "";
    const [y, m, day] = d.split("-");
    return day + "/" + m + "/" + y;
  };
  const monthYear = d => {
    if (!d) return "";
    return new Date(d + "T00:00:00").toLocaleDateString("en-AU", { month: "short", year: "numeric" });
  };
  const fmtStamp = iso => {
    if (!iso) return "";
    return new Date(iso).toLocaleString("en-AU", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  function computed(c) {
    const gov = Number(c.gov_fee) || 0, agency = Number(c.agency_fee) || 0;
    const prof = Number(c.prof_fee) || 0, paid = Number(c.prof_paid) || 0;
    const total = gov + agency + prof;
    const received = gov + agency + paid;
    const outstanding = prof - paid;
    const profitBase = agency + paid;
    const kShare = (Number(c.share_keila) || 0) / 100;
    const pShare = (Number(c.share_phill) || 0) / 100;
    return {
      charged: Number(c.amount_charged) || 0,
      total, received, outstanding,
      keila: profitBase * kShare,
      phill: profitBase * pShare
    };
  }
  function stagesDone(c) { return STAGES.filter(([k]) => c[k]).length; }

  function renderKpis(list) {
    const t = list.reduce((a, c) => {
      const f = computed(c);
      a.charged += f.charged; a.received += f.received; a.outstanding += f.outstanding;
      a.keila += f.keila; a.phill += f.phill;
      return a;
    }, { charged: 0, received: 0, outstanding: 0, keila: 0, phill: 0 });
    const active = list.filter(c => c.status !== "Closed").length;
    document.getElementById("kpis").innerHTML = [
      ["Active cases", active],
      ["Total charged", money(t.charged)],
      ["Received", money(t.received)],
      ["Outstanding fees", money(t.outstanding)],
      ["Keila profit", money(t.keila)],
      ["Phill profit", money(t.phill)]
    ].map(([label, val]) => `<div class="kpi"><span>${label}</span><strong>${val}</strong></div>`).join("");
  }

  function renderTable() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const visa = document.getElementById("filterVisa").value;
    const status = document.getElementById("filterStatus").value;
    const list = cases.filter(c =>
      (!q || (c.client + " " + c.visa).toLowerCase().includes(q)) &&
      (!visa || c.visa === visa) &&
      (!status || c.status === status)
    );
    renderKpis(cases);
    const wrap = document.getElementById("tableWrap");
    if (!cases.length) {
      wrap.innerHTML = `<div class="empty">No cases yet. Click "New case" to add the first one.</div>`;
      return;
    }
    if (!list.length) {
      wrap.innerHTML = `<div class="empty">No cases match these filters.</div>`;
      return;
    }
    const rows = list.map(c => {
      const f = computed(c);
      const dots = STAGES.map(([k]) => `<span class="step ${c[k] ? "on" : ""}"></span>`).join("");
      const statusClass = c.status === "Active" ? "" : c.status === "Closed" ? "ok" : "wait";
      const stageOpts = STAGE_OPTIONS.map(s => `<option ${s === c.stage ? "selected" : ""}>${esc(s)}</option>`).join("");
      const last = c.comments.length ? c.comments[c.comments.length - 1] : null;
      const preview = last ? `<div class="comment-preview">${esc(last.text.slice(0, 90))}${last.text.length > 90 ? "..." : ""}</div>` : "";
      return `<tr class="row" data-id="${c.id}">
        <td><strong>${esc(c.client)}</strong><div class="muted">${esc(c.lead)}</div></td>
        <td>${esc(c.visa)}${c.visa_date ? `<div class="muted">Visa ${fmtDate(c.visa_date)}</div>` : ""}</td>
        <td><span class="tag ${statusClass}">${esc(c.status)}</span></td>
        <td><select class="stage-quick" data-id="${c.id}">${stageOpts}</select></td>
        <td><div class="steps">${dots}</div><div class="muted">${stagesDone(c)} of ${STAGES.length} done</div></td>
        <td class="num">${money(f.charged)}</td>
        <td class="num">${money(f.outstanding)}<div class="muted">of ${money(f.total)} contracted</div></td>
        <td class="num">${money(f.keila)} / ${money(f.phill)}<div class="muted">Keila / Phill</div></td>
        <td class="muted">${esc(c.next)}${preview}${c.comments.length ? `<div class="muted">${c.comments.length} comment${c.comments.length > 1 ? "s" : ""}</div>` : ""}</td>
      </tr>`;
    }).join("");
    wrap.innerHTML = `<div class="tablewrap"><table>
      <thead><tr>
        <th>Client</th><th>Visa</th><th>Status</th><th>Stage</th><th>Steps</th>
        <th class="num">Charged</th><th class="num">Outstanding</th><th class="num">Profit split</th><th>Next action and comments</th>
      </tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  function refreshVisaFilter() {
    const sel = document.getElementById("filterVisa");
    const current = sel.value;
    const visas = [...new Set(cases.map(c => c.visa).filter(Boolean))].sort();
    sel.innerHTML = `<option value="">All visas</option>` + visas.map(v => `<option ${v === current ? "selected" : ""}>${esc(v)}</option>`).join("");
  }

  function refresh() { refreshVisaFilter(); renderTable(); save(); }

  // Modal form
  const form = document.getElementById("caseForm");
  document.getElementById("stageSelect").innerHTML = STAGE_OPTIONS.map(s => `<option>${esc(s)}</option>`).join("");

  function renderComments() {
    const box = document.getElementById("commentList");
    if (!draftComments.length) {
      box.innerHTML = `<p class="muted" style="margin:0 0 6px">No comments yet.</p>`;
      return;
    }
    box.innerHTML = draftComments.slice().reverse().map(x =>
      `<div class="comment">
        <div class="stamp">${x.at ? fmtStamp(x.at) : "Earlier note"}</div>
        <div>${esc(x.text)}</div>
        <button type="button" class="link" data-cid="${x.id}">Remove</button>
      </div>`
    ).join("");
  }

  function addDraftComment(text) {
    const t = (text || "").trim();
    if (!t) return;
    draftComments.push({ id: uid(), at: new Date().toISOString(), text: t });
    renderComments();
  }

  function openForm(c) {
    editingId = c ? c.id : null;
    document.getElementById("formTitle").textContent = c ? "Edit case" : "New case";
    document.getElementById("btnDelete").hidden = !c;
    form.reset();
    const data = c || withDefaults({});
    for (const el of form.elements) {
      if (!el.name) continue;
      el.value = data[el.name] != null ? data[el.name] : "";
    }
    draftComments = c ? c.comments.map(x => Object.assign({}, x)) : [];
    document.getElementById("newComment").value = "";
    renderComments();
    updateSplitPreview();
    document.getElementById("overlay").classList.add("open");
  }
  function closeForm() { document.getElementById("overlay").classList.remove("open"); }

  function readForm() {
    const fd = new FormData(form);
    const o = {};
    for (const [k, v] of fd.entries()) o[k] = v;
    ["amount_charged", "gov_fee", "agency_fee", "prof_fee", "prof_paid", "share_keila", "share_phill"].forEach(k => o[k] = Number(o[k]) || 0);
    return o;
  }

  function updateSplitPreview() {
    const o = readForm();
    const f = computed(o);
    document.getElementById("splitPreview").innerHTML =
      `Charged to client <strong>${money(f.charged)}</strong> &middot; Contracted <strong>${money(f.total)}</strong> &middot; Outstanding <strong>${money(f.outstanding)}</strong><br>` +
      `Profit base (agency fee plus professional fee received) <strong>${money((o.agency_fee || 0) + (o.prof_paid || 0))}</strong><br>` +
      `Keila <strong>${money(f.keila)}</strong> &middot; Phill <strong>${money(f.phill)}</strong>` +
      (o.share_keila + o.share_phill !== 100 ? `<br><span style="color:#b7791f">Shares do not add up to 100%.</span>` : "");
  }

  form.addEventListener("input", updateSplitPreview);

  document.getElementById("btnAddComment").onclick = () => {
    const ta = document.getElementById("newComment");
    addDraftComment(ta.value);
    ta.value = "";
  };
  document.getElementById("commentList").addEventListener("click", e => {
    const btn = e.target.closest("button[data-cid]");
    if (!btn) return;
    draftComments = draftComments.filter(x => x.id !== btn.dataset.cid);
    renderComments();
  });

  form.addEventListener("submit", e => {
    e.preventDefault();
    const pending = document.getElementById("newComment");
    addDraftComment(pending.value);
    pending.value = "";
    const o = readForm();
    if (editingId) {
      const idx = cases.findIndex(c => c.id === editingId);
      cases[idx] = Object.assign({}, cases[idx], o, { id: editingId, comments: draftComments.slice() });
    } else {
      cases.push(withDefaults(Object.assign({}, o, { comments: draftComments.slice() })));
    }
    closeForm();
    refresh();
  });

  document.getElementById("btnNew").onclick = () => openForm(null);
  document.getElementById("btnCancel").onclick = closeForm;
  document.getElementById("overlay").addEventListener("click", e => {
    if (e.target.id === "overlay") closeForm();
  });
  document.getElementById("btnDelete").onclick = () => {
    const c = cases.find(x => x.id === editingId);
    if (c && confirm(`Delete case for ${c.client}? This cannot be undone.`)) {
      cases = cases.filter(x => x.id !== editingId);
      closeForm();
      refresh();
    }
  };

  // Table: quick stage change and open case
  document.getElementById("tableWrap").addEventListener("change", e => {
    const sel = e.target.closest("select.stage-quick");
    if (!sel) return;
    const c = cases.find(x => x.id === sel.dataset.id);
    if (c) { c.stage = sel.value; refresh(); }
  });
  document.getElementById("tableWrap").addEventListener("click", e => {
    if (e.target.closest("select")) return;
    const tr = e.target.closest("tr.row");
    if (!tr) return;
    const c = cases.find(x => x.id === tr.dataset.id);
    if (c) openForm(c);
  });

  ["search", "filterVisa", "filterStatus"].forEach(id =>
    document.getElementById(id).addEventListener("input", renderTable));

  // Backup
  document.getElementById("btnExport").onclick = () => {
    const blob = new Blob([JSON.stringify(cases, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kmp-case-tracker-backup.json";
    a.click();
  };
  document.getElementById("btnImport").onclick = () => document.getElementById("fileImport").click();
  document.getElementById("fileImport").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error("bad");
        cases = data.map(withDefaults);
        refresh();
      } catch (err) { alert("This file is not a valid tracker backup."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  refresh();
})();
</script>
</body>
</html>
