<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KMP Consulting — Formulário Visto de Turista (Subclass 600)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #F27B20;
      --orange-dark: #E06A10;
      --orange-light: #FFF5EC;
      --dark: #1a1a1a;
      --gray: #6b7280;
      --light-gray: #f3f4f6;
      --border: #e5e7eb;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #f8f8f8;
      min-height: 100vh;
      color: var(--dark);
    }

    /* Top bar */
    .topbar {
      background: linear-gradient(135deg, #F27B20 0%, #F5941E 100%);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-full {
      height: 34px;
      width: auto;
      display: block;
    }

    .logo-tagline {
      display: block;
      font-size: 10px;
      color: #fff;
      opacity: 0.92;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* Layout */
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .page-title h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .page-title p {
      font-size: 14px;
      color: var(--gray);
    }

    /* Step nav */
    .step-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 2px;
    }

    .step-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .step-btn.active {
      background: linear-gradient(135deg, #F27B20 0%, #F5941E 100%);
      color: #fff;
      box-shadow: 0 2px 10px rgba(242,123,32,0.35);
    }

    .step-btn.done {
      background: var(--orange-light);
      color: var(--orange);
    }

    .step-btn.pending {
      background: #e5e7eb;
      color: #9ca3af;
    }

    .step-connector {
      width: 28px;
      height: 2px;
      transition: background 0.3s;
    }

    .step-connector.done { background: var(--orange); }
    .step-connector.pending { background: #e5e7eb; }

    .step-label {
      text-align: center;
      font-size: 13px;
      color: var(--gray);
      margin: 0 0 20px;
    }

    .step-label strong { color: var(--dark); }

    /* Card */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.05);
      border: 1px solid #eee;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .card-header .icon { font-size: 28px; }

    .card-header h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 24px;
    }

    /* Form elements */
    .q { margin-bottom: 22px; }

    label.field-label {
      display: block;
      margin-bottom: 6px;
    }

    label.field-label .pt {
      font-weight: 700;
      font-size: 14px;
    }

    label.field-label .req { color: #e53e3e; }

    label.field-label .en {
      display: block;
      font-size: 12px;
      color: var(--gray);
      font-style: italic;
      margin-top: 2px;
    }

    .hint {
      font-size: 12px;
      color: var(--orange-dark);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Outfit', sans-serif;
      color: var(--dark);
      background: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(242,123,32,0.12);
    }

    select {
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%239ca3af' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 36px;
      cursor: pointer;
    }

    textarea { resize: vertical; min-height: 64px; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

    @media (max-width: 540px) {
      .row2, .row3 { grid-template-columns: 1fr; }
    }

    /* Radio */
    .radio-group { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px; }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-size: 14px;
      user-select: none;
    }

    .radio-outer {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }

    .radio-outer.checked { border-color: var(--orange); }

    .radio-inner {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--orange);
    }

    /* Conditional field */
    .conditional {
      margin-top: 8px;
      padding: 12px 16px;
      background: var(--orange-light);
      border-radius: 8px;
      border-left: 3px solid var(--orange);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0 20px;
    }

    .divider-line { height: 1px; flex: 1; background: var(--border); }

    .divider-text {
      font-size: 11px;
      font-weight: 700;
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    /* Declaration box */
    .declaration-box {
      padding: 20px 24px;
      background: var(--orange-light);
      border-radius: 12px;
      margin-bottom: 24px;
      border-left: 4px solid var(--orange);
    }

    .declaration-box p { font-size: 14px; line-height: 1.7; }
    .declaration-box p.en { font-size: 13px; color: var(--gray); font-style: italic; margin-top: 10px; }

    /* File upload */
    .file-upload {
      border: 2px dashed #d1d5db;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      transition: all 0.2s;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--gray);
      position: relative;
    }

    .file-upload input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      padding: 0;
      border: none;
      box-shadow: none;
    }

    .file-upload.has-file {
      border-style: solid;
      border-color: var(--orange);
      background: var(--orange-light);
      color: var(--orange-dark);
      font-weight: 500;
    }
    .file-upload-wrap { margin-bottom: 10px; }
    .file-list { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
    .file-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; background: #fff; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--dark); }
    .file-item span { word-break: break-all; }
    .file-remove { background: transparent; border: none; color: #e53e3e; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Outfit', sans-serif; flex-shrink: 0; }
    .file-remove:hover { text-decoration: underline; }
    .autosave-note { text-align: center; font-size: 12px; color: var(--gray); margin: 0 0 16px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .autosave-note .dot { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; display: inline-block; }

    /* Botões */
    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .btn-prev {
      padding: 10px 22px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--gray);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      transition: all 0.2s;
    }

    .btn-prev:hover { border-color: var(--orange); color: var(--orange); }

    .btn-next {
      padding: 10px 26px;
      background: linear-gradient(135deg, #F27B20 0%, #F5941E 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      box-shadow: 0 4px 14px rgba(242,123,32,0.3);
      transition: all 0.2s;
    }

    .btn-next:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-next:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error-msg {
      font-size: 13px;
      color: #e53e3e;
      margin-bottom: 8px;
      text-align: right;
    }

    /* Signature pad */
    canvas.sig-canvas {
      width: 100%;
      height: 150px;
      border: 1.5px dashed var(--orange);
      border-radius: 10px;
      background: #fafafa;
      touch-action: none;
      display: block;
    }
    .sig-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .sig-actions .sig-hint { font-size: 12px; color: var(--gray); }
    .sig-clear-btn {
      background: transparent;
      border: none;
      color: var(--orange);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .sig-clear-btn:hover { text-decoration: underline; }

    /* Success screen */
    .success-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--light-gray);
    }

    .success-card {
      background: #fff;
      border-radius: 20px;
      padding: 56px 44px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.08);
    }

    .success-icon {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: linear-gradient(135deg, #F27B20 0%, #F5941E 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .success-card h2 { font-size: 26px; font-weight: 800; margin-bottom: 10px; }
    .success-card p { color: var(--gray); font-size: 15px; line-height: 1.6; }

    .btn-reset {
      margin-top: 24px;
      padding: 12px 28px;
      background: transparent;
      border: 1.5px solid var(--orange);
      border-radius: 10px;
      color: var(--orange);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      margin-top: 18px;
    }

    /* Botões de PDF */
    .success-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
    .btn-pdf { display: inline-flex; align-items: center; gap: 7px; padding: 12px 28px; background: linear-gradient(135deg, #F27B20 0%, #F5941E 100%); border: none; border-radius: 10px; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Outfit', sans-serif; box-shadow: 0 4px 14px rgba(242,123,32,0.3); transition: all 0.2s; }
    .btn-pdf:hover { opacity: 0.9; }
    .btn-pdf-sm { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; background: transparent; border: 1.5px solid var(--orange); border-radius: 10px; color: var(--orange); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Outfit', sans-serif; transition: all 0.2s; }
    .btn-pdf-sm:hover { background: var(--orange-light); }
    .success-card .btn-reset { margin-top: 0; }

    /* Área de impressão (comprovante em PDF) */
    #print-area { display: none; }
    @media print {
      html, body { height: auto !important; }
      body { background: #fff !important; min-height: 0 !important; }
      .topbar, #app { display: none !important; }
      #print-area { display: block !important; }
      .print-doc { max-width: 100%; padding: 0; font-family: 'Outfit', sans-serif; color: #1a1a1a; }
      .print-head { display: flex; align-items: center; gap: 12px; border-bottom: 3px solid #F27B20; padding-bottom: 14px; margin-bottom: 20px; }
      .print-logo { width: 44px; height: 44px; border-radius: 10px; background: #F27B20; color: #fff; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; }
      .print-brand { font-weight: 700; font-size: 18px; }
      .print-tag { font-size: 10px; color: #F27B20; text-transform: uppercase; letter-spacing: 0.12em; }
      .print-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
      .print-date { font-size: 12px; color: #6b7280; margin-bottom: 18px; }
      .print-table { width: 100%; border-collapse: collapse; }
      .print-table tr { break-inside: avoid; page-break-inside: avoid; }
      .print-table td { padding: 7px 10px; border-bottom: 1px solid #e5e7eb; font-size: 12.5px; vertical-align: top; }
      .print-table td.pl { font-weight: 600; width: 38%; color: #6b7280; }
      .print-table td.pv { color: #1a1a1a; }
      .print-foot { margin-top: 18px; font-size: 10px; color: #9ca3af; }
    }
  </style>
</head>

let step = 0;

function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ f, step })); } catch (e) {}
}
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY));
    if (d && d.f && typeof d.f === "object") {
      f = d.f; step = d.step || 0;
      Object.keys(f).forEach(k => { if (k.indexOf("file_") === 0) delete f[k]; });
    }
  } catch (e) {}
}
function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
}

function set(key, val) { f[key] = val; saveDraft(); render(); }
function setValue(key, val) { f[key] = val; saveDraft(); }

function label(num, pt, en, req) {
  return `<label class="field-label">
    <span class="pt">${num ? `${num}. ` : ""}${pt}${req ? ' <span class="req">*</span>' : ""}</span>
    ${en ? `<span class="en">${en}</span>` : ""}
  </label>`;
}

function hint(text) {
  return `<p class="hint">${text}</p>`;
}

function input(key, placeholder, type = "text") {
  return `<input type="${type}" placeholder="${placeholder}" value="${f[key] || ""}"
    oninput="setValue('${key}', this.value)" />`;
}

function textarea(key, placeholder, rows = 3) {
  return `<textarea placeholder="${placeholder}" rows="${rows}"
    oninput="setValue('${key}', this.value)">${f[key] || ""}</textarea>`;
}

function select(key, options, placeholder) {
  const opts = options.map(o =>
    `<option value="${o}" ${f[key] === o ? "selected" : ""}>${o}</option>`
  ).join("");
  return `<select onchange="set('${key}', this.value)">
    <option value="" disabled ${!f[key] ? "selected" : ""}>${placeholder || "Selecione / Select"}</option>
    ${opts}
  </select>`;
}

function radio(key, options) {
  return `<div class="radio-group">
    ${options.map(o => `
      <label class="radio-label" onclick="set('${key}', '${o}')">
        <span class="radio-outer ${f[key] === o ? "checked" : ""}">
          ${f[key] === o ? '<span class="radio-inner"></span>' : ""}
        </span>
        ${o}
      </label>`).join("")}
  </div>`;
}

function conditional(show, content) {
  return show ? `<div class="conditional">${content}</div>` : "";
}

function divider(text) {
  return `<div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">${text}</span>
    <div class="divider-line"></div>
  </div>`;
}

function row2(a, b) { return `<div class="row2">${a}${b}</div>`; }
function row3(a, b, c) { return `<div class="row3">${a}${b}${c}</div>`; }
function q(content, mb) { return `<div class="q" ${mb ? `style="margin-bottom:${mb}px"` : ""}>${content}</div>`; }

function fileUpload(id, labelText) {
  const stored = f[`file_${id}`];
  const list = Array.isArray(stored) ? stored : (stored ? [stored] : []);
  const hasFiles = list.length > 0;
  const listHtml = hasFiles
    ? `<div class="file-list">${list.map((name, i) =>
        `<div class="file-item"><span>${escapeHtml(name)}</span><button type="button" class="file-remove" onclick="removeFile(event, '${id}', ${i})">remover</button></div>`
      ).join("")}</div>`
    : "";
  return `<div class="file-upload-wrap">
    <div class="file-upload ${hasFiles ? "has-file" : ""}" id="fu_${id}">
      <input type="file" accept=".pdf,.jpg,.jpeg,.png" multiple onchange="handleFile('${id}', this)" />
      ${hasFiles ? `+ Adicionar mais arquivos (${list.length} anexado${list.length > 1 ? "s" : ""})` : `↑ ${labelText} (PDF, JPG, PNG — Máx. 25MB por arquivo · vários arquivos permitidos)`}
    </div>
    ${listHtml}
  </div>`;
}

function handleFile(id, input) {
  if (input.files && input.files.length) {
    const key = `file_${id}`;
    if (!fileObjects[id]) fileObjects[id] = [];
    const existingNames = Array.isArray(f[key]) ? f[key] : (f[key] ? [f[key]] : []);
    Array.from(input.files).forEach(file => {
      if (!existingNames.includes(file.name)) {
        fileObjects[id].push(file);
        existingNames.push(file.name);
      }
    });
    f[key] = existingNames;
    saveDraft();
    render();
  }
}

function removeFile(ev, id, index) {
  ev.stopPropagation();
  const key = `file_${id}`;
  const list = Array.isArray(f[key]) ? f[key] : (f[key] ? [f[key]] : []);
  list.splice(index, 1);
  f[key] = list;
  if (fileObjects[id]) fileObjects[id].splice(index, 1);
  saveDraft();
  render();
}

function yn(value, detail) {
  if (!value) return null;
  if (value === "SIM/YES" && detail) return `${value} — ${detail}`;
  return value;
}

function buildFilePairs() {
  const FILE_LABELS = {
    passaporte: "Cópia do passaporte (página de dados)",
    renda: "Comprovante de renda ou holerite (solicitante ou sponsor)",
    extrato: "Extrato bancário dos últimos 3 meses (solicitante ou sponsor)",
    vinculo: "Comprovante de vínculo (trabalho/estudo)",
    enderecoComprovante: "Comprovante de endereço",
    passaporteAnfitriao: "Passaporte e visto de quem está convidando (host)",
    itinerario: "Itinerário de viagem",
    outros: "Outros documentos anexados",
    certidaoCasamento: "Certidão de casamento",
    certidaoDivorcio: "Certidão de divórcio",
    comprovacaoEmpresa: "Comprovação de abertura da empresa",
  };
  return Object.keys(FILE_LABELS).map(id => {
    const v = f[`file_${id}`];
    const list = Array.isArray(v) ? v : (v ? [v] : []);
    return [FILE_LABELS[id], list.length ? list.join(", ") : null];
  });
}

function escapeHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function generatePdfBlob() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4", compress: true });
  const marginX = 40;
  const rightX = 555;
  let y = 56;

  const barY = 26;
  const barH = 46;
  doc.setFillColor(242, 123, 32);
  doc.rect(marginX, barY, rightX - marginX, barH, "F");
  const logoW = 104;
  const logoH = logoW / LOGO_ASPECT_RATIO;
  doc.addImage("data:image/png;base64," + LOGO_PNG_B64, "PNG", marginX + 12, barY + (barH - logoH) / 2, logoW, logoH);

  y = barY + barH + 16;
  doc.setFontSize(7.5);
  doc.setFont(undefined, "normal");
  doc.setTextColor(242, 123, 32);
  doc.text("ESTRATEGIA QUE CONECTA. FUTURO QUE TRANSFORMA.", marginX, y);

  y += 14;
  doc.setDrawColor(242, 123, 32);
  doc.setLineWidth(1.2);
  doc.line(marginX, y, rightX, y);
  y += 22;

  const nome = `${f.nome || ""} ${f.sobrenome || ""}`.trim() || "Solicitante";
  doc.setTextColor(26, 26, 26);
  doc.setFontSize(13);
  doc.setFont(undefined, "bold");
  doc.text("Visto de Turista (Subclass 600) - Comprovante de Solicitacao", marginX, y);
  y += 15;

  doc.setFontSize(9);
  doc.setFont(undefined, "normal");
  doc.setTextColor(107, 114, 128);
  const geradoEm = `Solicitante: ${nome} - Gerado em ${new Date().toLocaleString("pt-BR")}`;
  doc.text(geradoEm, marginX, y);
  if (APPLICATION_ID) {
    doc.text(`ID da aplicacao (KMP Hub): ${APPLICATION_ID}`, marginX, y + 12);
    y += 12;
  }
  y += 16;

  const pairs = buildSummaryPairs();
  const colGap = 14;
  const colLabelW = 190;
  const colValueW = rightX - marginX - colLabelW - colGap;
  const pageBottom = 800;

  doc.setFontSize(9);
  const lineHeight = doc.getLineHeight();

  pairs.forEach(([k, v]) => {
    doc.setFont(undefined, "bold");
    const labelLines = doc.splitTextToSize(String(k), colLabelW);
    doc.setFont(undefined, "normal");
    const valueLines = doc.splitTextToSize(String(v), colValueW);
    const rowLines = Math.max(labelLines.length, valueLines.length);
    const rowHeight = rowLines * lineHeight + 6;

    if (y + rowHeight > pageBottom) {
      doc.addPage();
      y = 50;
    }

    doc.setTextColor(107, 114, 128);
    doc.setFont(undefined, "bold");
    doc.text(labelLines, marginX, y);

    doc.setTextColor(26, 26, 26);
    doc.setFont(undefined, "normal");
    doc.text(valueLines, marginX + colLabelW + colGap, y);

    y += rowHeight;
    doc.setDrawColor(229, 231, 235);
    doc.setLineWidth(0.5);
    doc.line(marginX, y - 5, rightX, y - 5);
  });

  if (f.assinaturaImg) {
    if (y + 90 > pageBottom) { doc.addPage(); y = 50; }
    y += 14;
    doc.setFontSize(9);
    doc.setFont(undefined, "bold");
    doc.setTextColor(107, 114, 128);
    doc.text("Assinatura", marginX, y);
    y += 10;
    try {
      doc.addImage(f.assinaturaImg, "PNG", marginX, y, 190, 65);
      y += 75;
    } catch (e) {
      // se a imagem por algum motivo não puder ser embutida, segue sem travar o PDF
    }
  }

  y += 12;
  if (y > pageBottom) { doc.addPage(); y = 50; }
  doc.setFontSize(7);
  doc.setTextColor(156, 163, 175);
  doc.text(
    `Este documento e uma copia das informacoes fornecidas pelo solicitante e nao constitui a aplicacao oficial. (c) ${new Date().getFullYear()} KMP Consulting. Versao ${FORM_VERSION}`,
    marginX, y
  );

  return doc.output("blob");
}

// ------------------------------------------------------------------
// ENVIO — reescrito em 01/09/2026
//
// Antes: o comprovante e os documentos eram compactados num zip, o zip
// era enviado por um endpoint de upload separado (api.web3forms.com/upload)
// para gerar uma URL assinada, e só então o formulário de texto era
// enviado com a chave desse upload dentro de um JSON. Se qualquer um
// desses passos falhasse (o upload, a assinatura, o PUT do zip), a
// função lançava um erro ANTES de enviar o texto, e nada chegava no
// seu email — nem as respostas do cliente.
//
// Agora: os dados do formulário são sempre enviados, mesmo que o envio
// dos documentos falhe por algum motivo. O comprovante em PDF e os
// documentos anexados são enviados diretamente no mesmo envio, como
// arquivos de verdade (multipart), sem depender do endpoint de upload
// separado. Se algum documento não puder ser incluído (por exemplo,
// por passar do limite total de anexos do seu provedor de email), você
// ainda recebe o email com todas as respostas e a lista dos documentos
// que o cliente anexou, para pedir por fora se precisar.
// ------------------------------------------------------------------

async function handleSubmit() {
  sending = true;
  sendError = null;
  sendingMsg = "";
  render();

  const nome = `${f.nome || ""} ${f.sobrenome || ""}`.trim() || "Solicitante";

  // Nome de confirmação e assinatura desenhada são obrigatórios.
  if (!f.assinatura || !f.assinatura.trim() || isSignatureBlank()) {
    sendError = "Preencha o nome completo e desenhe a assinatura na Etapa 9 (Declaração e Assinatura) antes de enviar.";
    sending = false;
    step = SECTIONS.length - 1;
    saveDraft();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  // Se a pessoa indicou que já mudou de nome, a certidão de casamento E o
  // documento de divórcio são obrigatórios, não é opcional enviar só um deles.
  if (f.mudouNome === "SIM/YES") {
    const temCasamento = Array.isArray(f.file_certidaoCasamento) ? f.file_certidaoCasamento.length > 0 : !!f.file_certidaoCasamento;
    const temDivorcio = Array.isArray(f.file_certidaoDivorcio) ? f.file_certidaoDivorcio.length > 0 : !!f.file_certidaoDivorcio;
    if (!temCasamento || !temDivorcio) {
      sendError = "Você indicou que já mudou de nome: é obrigatório anexar a certidão de casamento E o documento de divórcio na Etapa 1 (Dados Pessoais) antes de enviar.";
      sending = false;
      step = 0;
      saveDraft();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
  }

  // Guarda de tamanho por arquivo (mantido do fluxo anterior)
  const MAX = 25 * 1024 * 1024;
  for (const id in fileObjects) {
    for (const file of fileObjects[id]) {
      if (file.size > MAX) {
        sendError = `O arquivo "${file.name}" passa de 25 MB. Reduza o tamanho e anexe novamente.`;
        sending = false; render(); return;
      }
    }
  }

  const allEntries = [];
  for (const id in fileObjects) {
    for (const file of fileObjects[id]) {
      allEntries.push({ id, file });
    }
  }

  const FOLDER_LABELS = {
    passaporte: "Passaporte",
    renda: "Comprovante de Renda",
    extrato: "Extrato Bancario",
    vinculo: "Comprovante de Vinculo",
    enderecoComprovante: "Comprovante de Endereco",
    passaporteAnfitriao: "Passaporte e Visto do Anfitriao",
    itinerario: "Itinerario de Viagem",
    outros: "Outros Documentos",
    certidaoCasamento: "Certidao de Casamento",
    certidaoDivorcio: "Certidao de Divorcio",
    comprovacaoEmpresa: "Comprovacao de Abertura da Empresa",
  };

  sendingMsg = "Gerando comprovante em PDF…";
  render();
  const pdfBlob = generatePdfBlob();
  const pdfFile = new File([pdfBlob], `Comprovante_${nome.replace(/\s+/g, "_")}.pdf`, { type: "application/pdf" });

  // Monta o texto do email (sempre enviado, com ou sem documentos)
  const idLinha = APPLICATION_ID ? `ID da aplicação (KMP Hub): ${APPLICATION_ID}\n` : "";
  const linhas = buildSummaryPairs().map(([k, v]) => `${k}: ${v}`).join("\n");
  const corpo = `Nova solicitação de visto de turista — KMP Consulting\nData: ${new Date().toLocaleString("pt-BR")}\n${idLinha}\n${"=".repeat(50)}\n\n${linhas}`;

  const formData = new FormData();
  formData.append("access_key", WEB3FORMS_KEY);
  formData.append("subject", `Nova Solicitação de Visto Turista — ${nome}`);
  formData.append("from_name", "Formulário KMP Consulting");
  formData.append("message", corpo);
  formData.append("replyto", f.email || "");
  if (APPLICATION_ID) formData.append("application_id", APPLICATION_ID);

  // Web3Forms tem limite de 5 MB por arquivo anexado. Um zip com fotos de
  // passaporte, extratos etc facilmente passa disso, e se passar, o
  // Web3Forms rejeita o ENVIO INTEIRO (nem o texto chega). Por isso: só
  // anexamos o zip ao email se ele estiver dentro do limite; se estourar,
  // enviamos o texto normalmente (sempre chega) e guardamos o zip para o
  // passo obrigatório do WhatsApp, que é quem garante a entrega dos
  // documentos nesse caso.
  const ATTACH_LIMIT = 4.5 * 1024 * 1024;
  let attachmentNote = "";
  let zipBlob = null;
  let zipFilename = `Documentos_${nome.replace(/\s+/g, "_")}.zip`;

  try {
    sendingMsg = "Organizando e compactando os documentos…";
    render();
    const zip = new JSZip();
    zip.file(pdfFile.name, pdfBlob);
    for (const { id, file } of allEntries) {
      const folder = FOLDER_LABELS[id] || "Outros Documentos";
      zip.folder(folder).file(file.name, file);
    }
    zipBlob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });

    if (zipBlob.size <= ATTACH_LIMIT) {
      const zipFile = new File([zipBlob], zipFilename, { type: "application/zip" });
      formData.append("attachment", zipFile);
    } else {
      attachmentNote = `\n\nATENÇÃO: os documentos anexados pelo cliente somam ${(zipBlob.size / 1024 / 1024).toFixed(1)} MB, acima do limite de anexo por e-mail. Eles NÃO vieram neste e-mail — o cliente vai enviar o arquivo .zip separadamente pelo WhatsApp (passo obrigatório da tela de confirmação).`;
    }
  } catch (e) {
    // Se a compactação falhar por qualquer motivo, não trava o envio:
    // manda o formulário sem os documentos e avisa você no próprio email.
    attachmentNote = `\n\nATENÇÃO: os documentos anexados pelo cliente não puderam ser incluídos automaticamente neste email (erro: ${e && e.message ? e.message : "desconhecido"}). Entre em contato com o cliente para solicitar por fora.`;
  }

  if (attachmentNote) {
    formData.set("message", corpo + attachmentNote);
  }

  sendingMsg = "Enviando…";
  render();

  try {
    const res = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      body: formData, // não define Content-Type manualmente — o navegador cuida disso
    });
    const data = await res.json();
    if (data.success) {
      submitted = true;
      // Guarda o zip (se ficou grande demais para o e-mail) e o PDF para o
      // passo obrigatório de WhatsApp na tela de confirmação.
      window.__kmpZipBlob = zipBlob;
      window.__kmpZipFilename = zipFilename;
      window.__kmpZipTooBig = zipBlob ? zipBlob.size > ATTACH_LIMIT : false;
      window.__kmpPdfBlob = pdfBlob;
      window.__kmpPdfFilename = pdfFile.name;
      window.__kmpNome = nome;
      clearDraft();
      fileObjects = {};
    } else {
      throw new Error(data.message || "Erro desconhecido");
    }
  } catch (e) {
    sendError = "Não foi possível enviar: " + (e && e.message ? e.message : "erro desconhecido") + ". Se persistir, entre em contato com a KMP Consulting.";
  } finally {
    sending = false;
    sendingMsg = "";
    render();
  }
}

// ---- Salvar comprovante em PDF: mesmo PDF leve nativo usado no envio por email ----
function downloadComprovante() {
  const blob = window.__kmpPdfBlob || generatePdfBlob();
  const filename = window.__kmpPdfFilename || `Comprovante_${(window.__kmpNome || "Solicitante").replace(/\s+/g, "_")}.pdf`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ---- WhatsApp na tela de confirmação ----
// No celular, se os documentos ficaram grandes demais para o e-mail (ou o
// cliente simplesmente preferir), tentamos compartilhar o zip completo (ou
// o PDF, se não houver documentos) direto pelo menu nativo, com o WhatsApp
// da KMP Consulting como opção na lista. No computador, abre o WhatsApp Web
// com a mensagem pronta, e o cliente anexa manualmente o que for preciso.
function isMobileDevice() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
}

async function sendWhatsapp() {
  const nome = window.__kmpNome || `${f.nome || ""} ${f.sobrenome || ""}`.trim() || "Solicitante";
  const zipBlob = window.__kmpZipBlob;
  const zipTooBig = window.__kmpZipTooBig;
  const zipFilename = window.__kmpZipFilename || "Documentos.zip";
  const pdfBlob = window.__kmpPdfBlob;
  const pdfFilename = window.__kmpPdfFilename || "Comprovante.pdf";

  const msg = zipTooBig
    ? `Olá! Sou ${nome} e acabei de preencher o formulário de Visto de Turista (Subclass 600). Meus documentos passaram do limite de anexo por e-mail, então estou enviando o arquivo .zip com tudo (comprovante + documentos) por aqui.`
    : `Olá! Sou ${nome} e acabei de preencher o formulário de Visto de Turista (Subclass 600). Segue em anexo o comprovante em PDF da minha solicitação.`;

  if (isMobileDevice()) {
    try {
      const fileToShare = zipTooBig && zipBlob
        ? new File([zipBlob], zipFilename, { type: "application/zip" })
        : new File([pdfBlob || generatePdfBlob()], pdfFilename, { type: "application/pdf" });

      if (navigator.canShare && navigator.canShare({ files: [fileToShare] })) {
        await navigator.share({ files: [fileToShare], text: msg });
        return;
      }
    } catch (shareErr) {
      if (shareErr && shareErr.name === "AbortError") return;
      // qualquer outro erro: cai no link abaixo
    }
  }

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
}

function setupSignaturePad() {
  const canvas = document.getElementById('sigPad');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  sigCtx = ctx;

  function resizeCanvas() {
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const savedData = f.assinaturaImg;
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2C2C2C';
    if (savedData) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
      img.src = savedData;
    }
  }
  resizeCanvas();

  let drawing = false;
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  }
  function startDraw(e) { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function moveDraw(e) { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
  function endDraw() {
    if (!drawing) return;
    drawing = false;
    f.assinaturaImg = canvas.toDataURL('image/png');
    saveDraft();
  }
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  window.addEventListener('mouseup', endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', moveDraw, { passive: false });
  canvas.addEventListener('touchend', endDraw);
}

function clearSignature() {
  const canvas = document.getElementById('sigPad');
  if (canvas && sigCtx) {
    sigCtx.clearRect(0, 0, canvas.width, canvas.height);
  }
  delete f.assinaturaImg;
  saveDraft();
}

function isSignatureBlank() {
  return !f.assinaturaImg;
}

loadDraft();
render();
</script>
</body>
</html>
